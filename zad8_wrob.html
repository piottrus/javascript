<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wrobel 2P</title>
    <script type="text/javascript">  
   function show_confirm()   
       {  
         var r=confirm("Naciśnij klawisz");  
           if (r==true)   
                {  document.write("Nacisnąłeś OK!");  }  
           else   
             {  document.write("Nacisnąłeś Cancel!");  }  
      }  
</script>   
</head>
<body>
    <p style="font-size: 20px; font-weight: bold;">Zastosowanie: <br>
    Jest używany, jeśli chcemy zapytać użytkownika o weryfikacje, lub akceptację jakichś danych. <br>
    Użytkownik musi nacisnąć  „OK.” w celu akceptacji bądź „Cancel” w celu odrzucenia. <br>
    Jeżeli zostanie wybrane „OK.” metoda zwraca true w przeciwnym wypadku false. </p>
    <input type="button" onclick="show_confirm()" value="Pokaż confirm box" />  
    
</body>
</html>
