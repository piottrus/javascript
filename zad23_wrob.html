<html>
<head>
    <script language="JavaScript">
        function Drabina_wrobel(d_wro, x_wro) {
            d_wro=parseFloat(d_wro)
            x_wro=parseFloat(x_wro)
            L_wro=(Math.sqrt(d_wro*d_wro+x_wro*x_wro))
            document.getElementsByName('drabina')[0].value = L_wro.toFixed(2);
            alert("Drabina=" + L_wro.toFixed(2));
            pokaz1.innerHTML = "Drabina=" + L_wro.toFixed(2);

        }
        function Alfa_wrobel(d_wro, x_wro) {
            d_wro=parseFloat(d_wro)
            x_wro=parseFloat(x_wro)
            L_wro=(Math.sqrt(d_wro*d_wro+x_wro*x_wro))
            Alfa_wro=Math.asin(d_wro/L_wro)
            Alfa_wro=(Alfa_wro/Math.PI)*180;
            document.getElementsByName('alfa')[0].value = Alfa_wro.toFixed(2);
            alert("Alfa=" + Alfa_wro.toFixed(2));
            pokaz2.innerHTML = "Alfa=" + Alfa_wro.toFixed(2);

        }
    </script>
</head>

<body>
    obliczanie odległości od drabiny i kąta
    <br> <br>
    <form name="formularz" action="..." onsubmit="Drabina_wrobel(this.d_dana_wro.value,this.x_dana_wro.value);
    Alfa_wrobel(this.d_dana_wro.value,this.x_dana_wro.value);return false">
        Podaj d=
        <input size="6" name="d_dana_wro">
        Podaj x=
        <input size="6" name="x_dana_wro">
        <br> <br>
        <input TYPE="submit" Value="oblicz">
        <br> <br>
        Pole=
        <input size="6" name="drabina">
        Obwód=
        <input size="6" name="alfa">
    </form>
    <table>
        <tr id="pokaz1"></tr>
        <tr id="pokaz2"></tr>
    </table>
</body>
</html>
