<!DOCTYPE html>   
<head>    
<title> Użycie fukcji </title>    
<meta charset="utf-8">   
</head>  
<body> 
<div style="color:navy;font-size:50px;"> 
<script language="JavaScript"> 
var a=parseFloat(prompt("a=","")); 
var b=parseFloat(prompt("b=","")); 

function suma_wro(a, b) { 
return a + b; 
} 

function roznica_wro(a, b) {
    return a - b;
}

function mnozenie_wro(a, b) {
    return a * b; 
}

function dzielenie_wro(a, b) {
    return a / b;
}

function kwadrat_a_wro(a) {
    return a ** 2;
}

function kwadrat_b_wro(b) {
    return b ** 2;
}

function reszta_wro(a, b) {
    return a % b;
}

document.write("suma="+suma_wro(a,b)+"<br>"); 
document.write("roznica="+roznica_wro(a,b)+"<br>");
document.write("mnozenie="+mnozenie_wro(a,b)+"<br>");  
document.write("dzielenie="+dzielenie_wro(a,b)+"<br>"); 
document.write("kwadrat A="+kwadrat_a_wro(a)+"<br>"); 
document.write("kwadrat B="+kwadrat_b_wro(b)+"<br>"); 
document.write("reszta="+reszta_wro(a,b)+"<br>"); 

</script> 
</div> 
</body>

      </textarea>
